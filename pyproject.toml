[project]
name = "storage-service"
version = "0.1.0"
description = "A small, self-hostable file storage API with pluggable storage backends."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "boto3>=1.43.108",
    "cloud-storage-api",
]

[project.optional-dependencies]
# The HTTP service. Other teams that only need the shared DocumentStorage
# adapter (storage_service.wiring.document_storage_from_env) install the package
# without this extra, so our web framework pins never constrain theirs (#99).
server = [
    "fastapi>=0.142.2",
    "python-multipart>=0.0.32",
    "uvicorn>=0.54.0",
]

[build-system]
requires = ["uv_build>=0.11.7,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    # `uv sync` and CI install the dev group by default, so the server extra
    # comes with it: running and testing the service needs no extra flag.
    "storage-service[server]",
    "httpx2>=2.13.1",
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "ruff>=0.16.10",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Tests that need a real bucket are opt-in: `uv run --env-file .env pytest -m provider`.
# A later -m on the command line replaces the one here. --strict-markers turns a
# misspelled marker into an error instead of a test that silently runs in the fast suite.
addopts = "-m 'not provider' --strict-markers"
markers = ["provider: needs a real S3-compatible bucket configured in .env"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
strict = true
files = ["src", "tests"]
mypy_path = "src"
explicit_package_bases = true  # names test files tests.test_*, so the override below applies

[[tool.mypy.overrides]]
# boto3 and botocore ship without type information.
module = ["boto3", "botocore.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# Tests take pytest fixtures and stay unannotated. Their bodies are still checked.
module = ["tests.*"]
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = true

[tool.uv.sources]
cloud-storage-api = { git = "https://github.com/Dayana20/ospsd26-cloud-storage", subdirectory = "src/cloud_storage_api", rev = "0.3.1" }

<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  {# Our CSP blocks inline styles, so htmx must not inject its own. #}
  <meta name="htmx-config" content='{"includeIndicatorStyles": false}'>
  <title>{% block title %}Meeting prep{% endblock %}</title>
  <link rel="stylesheet" href="/static/app.css">
  <script src="/static/htmx.min.js" defer></script>
</head>
<body>
  <nav>
    <a href="/chat">Ask the agent</a>
    <a href="/">Prepare by hand</a>
    <span class="account">
      {% if request.state.user %}
      <span>Signed in as {{ request.state.user.email }}</span>
      <form action="/sign-out" method="post"><button type="submit">Sign out</button></form>
      {% else %}
      <a href="{{ sign_in_url }}">Sign in with Google</a>
      {% endif %}
    </span>
  </nav>
  <main>
    {% block content %}{% endblock %}
  </main>
</body>
</html>

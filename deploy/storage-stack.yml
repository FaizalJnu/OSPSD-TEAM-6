# The storage service, one container per deployed branch, all in one Portainer stack.
# storage-api serves main (it keeps the original stack's service name), and
# storage-dev serves dev. GitHub Actions sets IMAGE_TAG_<BRANCH> on every deploy,
# and only that branch's container is recreated. To deploy another branch, follow
# "Add a branch" in deploy/README.md.
services:
  storage-api:
    image: ghcr.io/faizaljnu/ospsd-team-6/storage:${IMAGE_TAG_MAIN:-main}
    container_name: team6-storage-api
    restart: unless-stopped
    environment:
      STORAGE_BACKEND: s3
      S3_ENDPOINT: ${S3_ENDPOINT}
      S3_REGION: ${S3_REGION}
      S3_BUCKET: ${S3_BUCKET_MAIN}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
    networks: [traefik]
    labels:
      - traefik.enable=true
      - traefik.docker.network=traefik-stack_default
      - traefik.http.routers.team6-storage.rule=Host(`ds.packapunch.xyz`)
      - traefik.http.routers.team6-storage.entrypoints=websecure
      - traefik.http.routers.team6-storage.tls.certresolver=leresolver
      - traefik.http.services.team6-storage.loadbalancer.server.port=8000

  storage-dev:
    image: ghcr.io/faizaljnu/ospsd-team-6/storage:${IMAGE_TAG_DEV:-dev}
    container_name: team6-storage-api-dev
    restart: unless-stopped
    environment:
      STORAGE_BACKEND: s3
      S3_ENDPOINT: ${S3_ENDPOINT}
      S3_REGION: ${S3_REGION}
      S3_BUCKET: ${S3_BUCKET_DEV}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
    networks: [traefik]
    labels:
      - traefik.enable=true
      - traefik.docker.network=traefik-stack_default
      - traefik.http.routers.team6-storage-dev.rule=Host(`ds-dev.packapunch.xyz`)
      - traefik.http.routers.team6-storage-dev.entrypoints=websecure
      - traefik.http.routers.team6-storage-dev.tls.certresolver=leresolver
      - traefik.http.services.team6-storage-dev.loadbalancer.server.port=8000

networks:
  traefik:
    name: traefik-stack_default
    external: true

# For the alembic command line, run from product/, for example:
#   DATABASE_URL=sqlite:///dev.sqlite3 uv run alembic revision --autogenerate -m "add conversations" --rev-id 0002
# Deploys and tests run migrations through meeting_prep.db instead (see README.md, Database).
# The database URL comes from DATABASE_URL, never from this file.

[alembic]
script_location = %(here)s/src/meeting_prep/db/migrations
# Files are named after the revision ID: 0002_add_conversations.py
file_template = %%(rev)s_%%(slug)s

[post_write_hooks]
# Tidy each new migration so CI's lint and format checks pass: drop unused
# imports (an empty migration uses neither op nor sa), then format.
hooks = ruff_check, ruff_format
ruff_check.type = exec
ruff_check.executable = ruff
ruff_check.options = check --fix --quiet REVISION_SCRIPT_FILENAME
ruff_format.type = exec
ruff_format.executable = ruff
ruff_format.options = format REVISION_SCRIPT_FILENAME

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
